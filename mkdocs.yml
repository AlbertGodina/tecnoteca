site_name: Tecnoteca
site_description: Guia de Tecnologia i Digitalització per a l'ESO
# PENDENT: canvia USUARI pel teu usuari o organització de GitHub
site_url: https://AlbertGodina.github.io/tecnoteca/
repo_url: https://github.com/AlbertGodina/tecnoteca
repo_name: AlbertGodina/tecnoteca
copyright: Tecnoteca · CC BY-SA 4.0

theme:
  name: material
  language: ca
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Canvia al mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Canvia al mode clar
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow
    - content.code.copy

plugins:
  - search
  # Descarrega i serveix en local les fonts externes (RGPD). Només actiu a GitHub Actions.
  - privacy:
      enabled: !ENV [CI, false]

extra_css:
  - stylesheets/tecnoteca.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Inici: index.md
  - 1r ESO: 1r/index.md
  - 2n ESO: 2n/index.md
  - 3r ESO:
    - 3r/index.md
    - "Unitat 1. Estructures":
      - 3r/unitat-1-estructures/index.md
      - "Fase 1. Què en sabem?":
        - "1. Observem ponts famosos": 3r/unitat-1-estructures/01-observem-ponts.md
        - "2. KWL: què sé, què vull aprendre": 3r/unitat-1-estructures/02-kwl.md
        - "3. Repte: la torre de paper": 3r/unitat-1-estructures/03-repte-torre-paper.md
      - "Fase 2. Aprenem":
        - "4. Forces i esforços en acció": 3r/unitat-1-estructures/04-forces-i-esforcos.md
        - "5. Materials i propietats mecàniques": 3r/unitat-1-estructures/05-materials-i-pont-de-paper.md
        - "6. Anàlisi de ponts reals": 3r/unitat-1-estructures/06-analisi-de-ponts.md
        - "7. Disseny del pont": 3r/unitat-1-estructures/07-disseny-del-pont.md
        - "8. Construcció al taller": 3r/unitat-1-estructures/08-construccio-al-taller.md
      - "Fase 3. Què hem après?":
        - "9. Revisem el KWL": 3r/unitat-1-estructures/09-revisem-el-kwl.md
        - "10. Diari tècnic": 3r/unitat-1-estructures/10-diari-tecnic.md
        - "11. Debat": 3r/unitat-1-estructures/11-debat.md
      - "Fase 4. Apliquem":
        - "12. Test de resistència": 3r/unitat-1-estructures/12-test-de-resistencia.md
        - "13. Memòria del projecte": 3r/unitat-1-estructures/13-memoria.md
        - "14. Exposició": 3r/unitat-1-estructures/14-exposicio.md
      - "Activitats complementàries":
        - "Detectius d'estructures": 3r/unitat-1-estructures/detectius-estructures.md
        - "Activitat extra": 3r/unitat-1-estructures/activitat-extra.md
  - 4t ESO: 4t/index.md
  - Banc temàtic:
    - banc/index.md
    - "Forces": banc/forces.md
    - "Esforços": banc/esforcos.md
    - "Propietats mecàniques dels materials": banc/propietats-mecaniques.md
    - "Estructures": banc/estructures.md
    - "Elements estructurals i solucions constructives": banc/elements-i-solucions.md
  - Eines: eines/index.md
  - Sobre Tecnoteca: sobre.md
